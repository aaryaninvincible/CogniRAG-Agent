services:
  cognirag-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognirag-agent-service
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
